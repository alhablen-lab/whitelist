<!DOCTYPE html>
<html lang="id">
<head>
<script>
const SUPABASE_URL = "https://gfumcxyspttsjqfkzxcr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6DKmlFaYPuhHpR77Xfw7-A_gUwgHktJ";
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hablen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg:#0a0a0a; --panel:#121212; --panel2:#181818; --line:rgba(255,255,255,.09);
    --text:#f2f2f2; --muted:#8b8b8b; --ok:#4ade80; --bad:#fb7185;
    --head:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;
    background-image:radial-gradient(70% 35% at 50% 0%,rgba(255,255,255,.06),transparent 70%);background-attachment:fixed}
  h1,h2,h3{font-family:var(--head);margin:0}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px}
  .login-card{width:100%;max-width:390px;padding:30px 26px}
  .brand{text-align:center;margin-bottom:22px}
  .brand .name{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:.22em}
  .brand .sub{font-size:10.5px;letter-spacing:.32em;color:var(--muted);margin-top:6px}
  .rule{height:1px;margin:16px auto 0;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
  label.l{display:block;font-size:13px;color:#cfcfcf;margin:14px 0 7px}
  .inp{width:100%;min-height:48px;padding:0 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);outline:none;font-size:16px}
  .inp:focus{border-color:rgba(255,255,255,.5)} .inp::placeholder{color:#5f5f5f}
  .inp option{color:#111}
  .btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.97)}
  .btn-w{background:#fff;color:#0a0a0a;border-color:#fff}
  .btn-full{width:100%} .btn-sm{min-height:40px;padding:0 14px;font-size:14px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:12px;text-align:center}
  .link{background:none;border:0;padding:0;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* SHELL */
  #app{display:flex;min-height:100vh}
  aside{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  aside.open{transform:none}
  .side-brand{padding:26px 20px 20px;text-align:center;border-bottom:1px solid var(--line)}
  .logo{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;background:#0c0c0c;border:1px solid var(--line);display:grid;place-items:center}
  .side-brand .name{font-family:var(--head);font-weight:700;letter-spacing:.2em;font-size:19px}
  .side-brand .sub{font-size:9.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px}
  nav{padding:14px 10px;flex:1;overflow:auto}
  .nav{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;border:0;background:none;color:#a8a8a8;border-radius:10px;cursor:pointer;text-align:left;font-size:14.5px}
  .nav svg{flex:none;opacity:.8}
  .nav.active{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 3px 0 0 #fff}
  .side-foot{padding:12px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
  .content{flex:1;min-width:0;width:100%}
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,10,.9);backdrop-filter:blur(10px);z-index:20}
  .burger{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
  main{padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:980px}
  .page-title{font-size:30px;font-weight:700}
  .page-sub{color:var(--muted);margin:6px 0 0;font-size:14px}
  .uline{height:1px;margin:16px 0 22px;background:linear-gradient(90deg,#fff 0,#fff 60px,var(--line) 60px)}
  @media(min-width:900px){
    aside{transform:none} .content{margin-left:250px;width:auto} .burger,#scrim{display:none!important}
    .topbar{display:none} main{padding:34px 40px 50px}
  }

  /* COMPONENTS */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
  @media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{padding:16px}.stat .v{font-family:var(--head);font-size:28px;font-weight:700;margin-top:6px}
  .used{padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:#fff}
  .tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tools .inp{flex:1;min-width:150px}
  .row{padding:14px 16px;margin-bottom:10px;display:grid;gap:10px;grid-template-columns:1fr auto;align-items:center}
  .row .acts{display:flex;gap:8px}
  .ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;color:#cfcfcf}
  .ibtn.danger{color:var(--bad)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
  .b-ok{background:rgba(74,222,128,.14);color:#86efac;border:1px solid rgba(74,222,128,.35)}
  .b-bad{background:rgba(251,113,133,.14);color:#fda4b4;border:1px solid rgba(251,113,133,.35)}
  .b-n{background:rgba(255,255,255,.07);color:#cfcfcf;border:1px solid var(--line)}
  .sw{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.14);border:0;cursor:pointer;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
  .sw.on{background:#4ade80}.sw.on::after{transform:translateX(20px)}
  .empty{text-align:center;padding:60px 16px;color:var(--muted)}
  .empty b{display:block;color:var(--text);margin-top:10px;font-size:16px}
  .modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:24px;position:relative}
  .modal h2{font-size:21px}.modal .x{position:absolute;top:10px;right:10px}
  pre.code{background:#0c0c0c;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:280px;overflow:auto;font-size:11.5px;line-height:1.5;margin:12px 0;white-space:pre}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:#fff;color:#0a0a0a;padding:11px 18px;border-radius:12px;font-weight:600;display:none;max-width:90%}
  .plan{padding:20px;margin-bottom:12px}.plan ul{margin:10px 0 0;padding-left:18px;color:#cfcfcf;line-height:1.8}
  ol.steps{padding-left:20px;line-height:1.9;color:#d6d6d6}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN / REGISTER -->
<section id="login" class="hidden">
  <div class="card login-card">
    <div class="brand">
      <div class="name">HABLEN</div>
      <div class="sub">SCRIPT AUTHORITY</div>
      <div class="rule"></div>
    </div>
    <label class="l" for="u">Username</label>
    <input id="u" class="inp" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label class="l" for="p">Password</label>
    <input id="p" type="password" class="inp" placeholder="Enter your password" autocomplete="current-password">
    <div id="p2wrap" class="hidden">
      <label class="l" for="p2">Konfirmasi password</label>
      <input id="p2" type="password" class="inp" placeholder="Ulangi password" autocomplete="new-password">
    </div>
    <button id="authBtn" class="btn btn-w btn-full" style="margin-top:20px" data-act="auth">LOGIN</button>
    <div id="authErr" class="err"></div>
    <p class="muted sm" style="text-align:center;margin:6px 0 0">
      <span id="swText">Don't have an account?</span> <button class="link" data-act="switch-auth" id="swBtn">Register Now</button>
    </p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <div id="scrim" class="hidden" data-act="close-nav"></div>
  <aside id="side">
    <div class="side-brand">
      <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.5 20 7v10l-8 4.5L4 17V7z"/><path d="M4 7l8 4.5L20 7M12 11.5v10"/></svg></div>
      <div class="name">HABLEN</div><div class="sub">SCRIPT AUTHORITY</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="muted xs" id="who" style="margin:0 6px 8px;word-break:break-all"></div>
      <button class="btn btn-sm btn-full" data-act="logout">Keluar</button>
    </div>
  </aside>
  <div class="content">
    <div class="topbar">
      <button class="burger" aria-label="Menu" data-act="open-nav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <b style="font-family:var(--head);letter-spacing:.18em">HABLEN</b>
    </div>
    <main id="page"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script>
const configured = !SUPABASE_URL.startsWith("ISI_") && !SUPABASE_ANON_KEY.startsWith("ISI_");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const $ = (s) => document.querySelector(s);
const MAX_PRODUCTS = 100;
const EMAIL_DOMAIN = "hablen.app";
const S = { page: "dashboard", products: [], mode: "login", user: null };

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtDate = (iso) => new Date(iso).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
const fmtTime = (iso) => new Date(iso).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = "none"), 2400); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("Tersalin");
}
function genKey() {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", a = new Uint32Array(10); crypto.getRandomValues(a);
  return "PROD_" + Array.from(a, (n) => abc[n % abc.length]).join("");
}

/* ---------- ICONS ---------- */
const ic = {
  dashboard: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  products: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg>',
  whitelist: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  devlogs: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>',
  mailbox: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  upgrade: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  file: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  copy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>',
  ext: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const PAGES = [
  ["dashboard", "Dashboard"], ["products", "Products"], ["whitelist", "Whitelist"], ["devlogs", "DevLogs"],
  ["mailbox", "Mailbox"], ["upgrade", "Upgrade Plan"], ["info", "Information"],
];
$("#nav").innerHTML = PAGES.map(([id, label]) => `<button class="nav" data-page="${id}">${ic[id === "info" ? "info" : id]}<span>${label}</span></button>`).join("");

/* ---------- MODAL ---------- */
function openModal(html) {
  $("#modalRoot").innerHTML = `<div class="modal-wrap" data-act="modal-bg"><div class="card modal">
    <button class="ibtn x" data-act="close-modal" aria-label="Tutup">${ic.x}</button>${html}</div></div>`;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

/* ---------- AUTH ---------- */
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
async function showApp() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  const { data } = await sb.auth.getUser(); S.user = data.user;
  $("#who").textContent = (S.user?.email || "").split("@")[0];
  go(S.page);
}
function setMode(m) {
  S.mode = m; const reg = m === "register";
  $("#authBtn").textContent = reg ? "REGISTER" : "LOGIN";
  $("#p2wrap").classList.toggle("hidden", !reg);
  $("#swText").textContent = reg ? "Already have an account?" : "Don't have an account?";
  $("#swBtn").textContent = reg ? "Login" : "Register Now";
  $("#authErr").textContent = "";
}
async function doAuth() {
  const err = $("#authErr"); err.textContent = "";
  const user = $("#u").value.trim().toLowerCase(), pass = $("#p").value;
  if (!/^[a-z0-9_]{3,20}$/.test(user)) return (err.textContent = "Username 3–20 karakter: huruf kecil, angka, atau _");
  if (pass.length < 6) return (err.textContent = "Password minimal 6 karakter");
  const email = `${user}@${EMAIL_DOMAIN}`;
  const btn = $("#authBtn"); btn.disabled = true;
  try {
    if (S.mode === "register") {
      if (pass !== $("#p2").value) return (err.textContent = "Konfirmasi password tidak sama");
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) return (err.textContent = error.message.includes("already") ? "Username sudah dipakai" : error.message);
      if (!data.session) return (err.textContent = "Akun dibuat, tapi Supabase meminta konfirmasi email. Matikan 'Confirm email' di Authentication > Providers > Email.");
      toast("Akun dibuat"); return showApp();
    }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) return (err.textContent = "Username atau password salah");
    showApp();
  } finally { btn.disabled = false; }
}

/* ---------- ROUTER ---------- */
function closeNav() { $("#side").classList.remove("open"); $("#scrim").classList.add("hidden"); }
function head(title, sub) { return `<h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p><div class="uline"></div>`; }
async function go(page) {
  S.page = page; closeNav();
  document.querySelectorAll(".nav").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  $("#page").innerHTML = '<p class="muted">Memuat…</p>';
  try { await ({ dashboard: pgDashboard, products: pgProducts, whitelist: pgWhitelist, devlogs: pgLogs, mailbox: pgMailbox, upgrade: pgUpgrade, info: pgInfo })[page](); }
  catch (e) { $("#page").innerHTML = `<p class="err">Gagal memuat: ${esc(e.message || e)}</p>`; }
}
async function fetchProducts() {
  const { data, error } = await sb.from("products").select("*").order("created_at", { ascending: false });
  if (error) throw error; S.products = data;
}
const count = async (q) => { const { count: c, error } = await q; if (error) throw error; return c || 0; };

/* ---------- PAGES ---------- */
async function pgDashboard() {
  const [p, w, l, u, recent] = await Promise.all([
    count(sb.from("products").select("*", { count: "exact", head: true })),
    count(sb.from("whitelists").select("*", { count: "exact", head: true }).eq("is_active", true)),
    count(sb.from("execution_logs").select("*", { count: "exact", head: true })),
    count(sb.from("execution_logs").select("*", { count: "exact", head: true }).eq("status", "UNAUTHORIZED")),
    sb.from("execution_logs").select("*").order("created_at", { ascending: false }).limit(5),
  ]);
  const stat = (k, v) => `<div class="card stat"><div class="muted xs">${k}</div><div class="v">${v}</div></div>`;
  $("#page").innerHTML = head("Dashboard", "Ringkasan sistem whitelist kamu") +
    `<div class="stats">${stat("PRODUCTS", p + " / " + MAX_PRODUCTS)}${stat("WHITELIST AKTIF", w)}${stat("TOTAL EKSEKUSI", l)}${stat("UNAUTHORIZED", u)}</div>
     <h3 style="margin:6px 0 12px;font-size:18px">Eksekusi terbaru</h3>` + (recent.data?.length ? recent.data.map(logCard).join("") : emptyBox("Belum ada eksekusi"));
}
function emptyBox(t, s = "") { return `<div class="empty">${ic.mailbox}<b>${t}</b><span class="sm">${s}</span></div>`; }

async function pgProducts() {
  await fetchProducts(); renderProducts("");
}
function renderProducts(q) {
  const list = S.products.filter((p) => (p.name + p.product_key).toLowerCase().includes(q.toLowerCase()));
  const n = S.products.length;
  const rows = list.map((p) => `
    <div class="card row">
      <div style="min-width:0">
        <div style="font-weight:600">${esc(p.name)} ${p.is_active ? "" : '<span class="badge b-n">NONAKTIF</span>'}</div>
        <div class="mono muted" style="margin-top:4px">${esc(p.product_key)}</div>
        <div class="muted xs" style="margin-top:2px">${esc(fmtDate(p.created_at))}</div>
      </div>
      <div class="acts">
        <button class="ibtn" title="Script" data-act="p-script" data-id="${esc(p.id)}">${ic.file}</button>
        <button class="ibtn" title="Edit" data-act="p-edit" data-id="${esc(p.id)}">${ic.edit}</button>
        <button class="ibtn danger" title="Hapus" data-act="p-del" data-id="${esc(p.id)}">${ic.trash}</button>
      </div>
    </div>`).join("");
  const box = $("#prodList");
  if (box) { box.innerHTML = rows || emptyBox("Tidak ada produk"); return; }
  $("#page").innerHTML = head("Products", "Kelola produk script Roblox Studio kamu") +
    `<div class="card used"><span class="muted xs" style="letter-spacing:.1em">PRODUCTS USED</span>
       <div class="bar"><i style="width:${(n / MAX_PRODUCTS) * 100}%"></i></div><b>${n} / ${MAX_PRODUCTS}</b></div>
     <div class="tools"><input id="pSearch" class="inp" placeholder="Search products…"><button class="btn btn-w" data-act="p-add">+ Add Product</button></div>

        <div class="muted sm" style="margin-top:6px">${esc(w.products?.name || "-")}${w.note ? " · " + esc(w.note) : ""}</div>
      </div>

        <button class="sw ${w.is_active ? "on" : ""}" aria-label="Aktif/nonaktif" data-act="w-toggle" data-id="${esc(w.id)}" data-val="${w.is_active}"></button>
        <button class="ibtn danger" data-act="w-del" data-id="${esc(w.id)}">${ic.trash}</button>

    `<div class="tools"><button class="btn btn-w btn-full" data-act="w-add">+ Add Whitelist</button></div>` +
    (rows || emptyBox("Whitelist kosong", "Tambahkan GroupId atau UserId Roblox"));
}

    <div style="font-weight:600">${esc(l.game_name || "Unknown")}</div>
    <div class="muted sm">${esc(l.creator_type)} ${esc(l.creator_id)} · Place ${esc(l.place_id)}${l.products?.name ? " · " + esc(l.products.name) : ""}</div>
    ${l.game_url ? `<a class="btn btn-sm" style="justify-self:start;text-decoration:none" href="${esc(l.game_url)}" target="_blank" rel="noopener noreferrer">${ic.ext} Buka map Roblox</a>` : ""}
  </div>`;
}

  if (error) throw error;
  $("#page").innerHTML = head("DevLogs", "Riwayat eksekusi script di game Roblox") +
    `<button class="btn btn-full" style="margin-bottom:16px" data-act="refresh">Muat ulang</button>` +
    (data.length ? data.map(logCard).join("") : emptyBox("Belum ada eksekusi"));

async function pgMailbox() {
  $("#page").innerHTML = head("Mailbox", "Pesan dari administrator") + emptyBox("No Messages", "Your inbox is empty");
}
async function pgUpgrade() {
  $("#page").innerHTML = head("Upgrade Plan", "Pilih paket sesuai kebutuhanmu") +
    `<div class="card plan"><h3>Free <span class="badge b-ok">AKTIF</span></h3><ul><li>Hingga ${MAX_PRODUCTS} produk</li><li>Whitelist Group &amp; User</li><li>DevLogs 100 terbaru</li></ul></div>
     <div class="card plan"><h3>Pro <span class="badge b-n">SEGERA</span></h3><ul><li>Produk lebih banyak</li><li>Riwayat log lebih panjang</li></ul></div>`;
}
async function pgInfo() {
  $("#page").innerHTML = head("Information", "Cara memakai Hablen") +
    `<div class="card plan"><ol class="steps">
      <li>Buka <b>Products</b> lalu tekan <b>Add Product</b>.</li>
      <li>Tekan ikon file pada produk untuk menyalin <b>loader script</b> yang sudah terisi.</li>
      <li>Tempel di <b>ServerScriptService</b>, lalu taruh sistem utama kamu di dalam <code>StartProduct()</code>.</li>
      <li>Di <b>Whitelist</b>, tambahkan GroupId atau UserId pemilik game.</li>
      <li>Nyalakan <b>Allow HTTP Requests</b> di Game Settings, lalu pantau hasilnya di <b>DevLogs</b>.</li></ol></div>`;
}

/* ---------- LOADER GENERATOR ---------- */
function genLoader(key) {
  return `-- Hablen Loader | Script di ServerScriptService
-- Wajib: Game Settings > Security > Allow HTTP Requests
local SUPABASE_URL = "${SUPABASE_URL}"
local SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
local PRODUCT_KEY = "${key}"
local LOCK_PLAYERS = false
local SHUTDOWN_IF_BLOCKED = false

local HttpService = game:GetService("HttpService")
local MarketplaceService = game:GetService("MarketplaceService")
local Players = game:GetService("Players")

local function StartProduct()
	-- >>> TEMPELKAN SKRIP SISTEM UTAMA ANDA DI SINI <<<
end

local function getGameName()
	local ok, info = pcall(function() return MarketplaceService:GetProductInfo(game.PlaceId) end)
	return (ok and info and info.Name) and tostring(info.Name) or "Unknown"
end

local function verify()
	local body = HttpService:JSONEncode({
		p_product_key = PRODUCT_KEY, p_place_id = game.PlaceId, p_game_name = getGameName(),
		p_creator_type = string.upper(game.CreatorType.Name), p_creator_id = game.CreatorId,
	})
	for attempt = 1, 3 do
		local ok, res = pcall(function()
			return HttpService:RequestAsync({
				Url = SUPABASE_URL .. "/rest/v1/rpc/verify_whitelist", Method = "POST",
				Headers = { ["apikey"] = SUPABASE_ANON_KEY, ["Content-Type"] = "application/json" }, Body = body,
			})
		end)
		if ok and res.Success then
			local d, data = pcall(function() return HttpService:JSONDecode(res.Body) end)
			if d and type(data) == "table" then return data.authorized == true, tostring(data.message or "-") end
			return false, "Respons tidak valid"
		end
		warn("[Hablen] Percobaan " .. attempt .. " gagal")
		if attempt < 3 then task.wait(2 * attempt) end
	end
	return false, "Tidak bisa terhubung ke server whitelist"
end

local function blockProduct(reason)
	warn("[Hablen] TIDAK BERIZIN: " .. reason)
	if SHUTDOWN_IF_BLOCKED then
		local function kick(p) p:Kick("Sistem tidak berizin untuk game ini.") end
		for _, p in ipairs(Players:GetPlayers()) do kick(p) end
		Players.PlayerAdded:Connect(kick)
	elseif LOCK_PLAYERS then
		local function freeze(p)
			local function f(c)
				local h = c:WaitForChild("Humanoid", 10); local r = c:WaitForChild("HumanoidRootPart", 10)
				if h then h.WalkSpeed = 0; h.JumpPower = 0; h.JumpHeight = 0 end
				if r then r.Anchored = true end
			end
			p.CharacterAdded:Connect(f); if p.Character then f(p.Character) end
		end
		for _, p in ipairs(Players:GetPlayers()) do freeze(p) end
		Players.PlayerAdded:Connect(freeze)
	end
end

local ok, msg = verify()
if ok then print("[Hablen] Whitelist valid: " .. msg); StartProduct() else blockProduct(msg) end
`;
}

/* ---------- EVENTS ---------- */
document.addEventListener("input", (e) => { if (e.target.id === "pSearch") renderProducts(e.target.value); });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.target.id === "u" || e.target.id === "p" || e.target.id === "p2")) doAuth(); });

document.addEventListener("click", async (e) => {
  const pg = e.target.closest("[data-page]"); if (pg) return go(pg.dataset.page);
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { act, id } = el.dataset;
  if (act === "modal-bg") { if (e.target === el) closeModal(); return; }
  if (act === "close-modal") return closeModal();
  if (act === "open-nav") { $("#side").classList.add("open"); $("#scrim").classList.remove("hidden"); return; }
  if (act === "close-nav") return closeNav();
  if (act === "switch-auth") return setMode(S.mode === "login" ? "register" : "login");
  if (act === "auth") return doAuth();
  if (act === "logout") { await sb.auth.signOut(); return showLogin(); }
  if (act === "refresh") return go(S.page);

  /* products */
  if (act === "p-add") {
    if (S.products.length >= MAX_PRODUCTS) return toast("Batas " + MAX_PRODUCTS + " produk tercapai");
    return openModal(`<h2>Add New Product</h2><p class="muted sm" style="margin:6px 0 16px">Create a Roblox Studio script product</p>
      <label class="l" for="mName" style="margin-top:0">Product Name</label>
      <input id="mName" class="inp" placeholder="mis. OverheadV4 Ascend System" maxlength="60">
      <button class="btn btn-w btn-full" style="margin-top:16px" data-act="p-create">Create Product</button>`);
  }
  if (act === "p-create") {
    const name = $("#mName").value.trim(); if (!name) return toast("Isi nama produk");
    const { error } = await sb.from("products").insert({ name, product_key: genKey() });
    if (error) return toast("Gagal: " + error.message);
    closeModal(); toast("Produk dibuat"); return go("products");
  }
  if (act === "p-script") {
    const p = S.products.find((x) => x.id === id); if (!p) return;
    S.script = genLoader(p.product_key);
    return openModal(`<h2>Loader Script</h2><p class="muted sm" style="margin:6px 0 0">${esc(p.name)} — sudah terisi URL, key, dan product key.</p>
      <pre class="code">${esc(S.script)}</pre>
      <button class="btn btn-w btn-full" data-act="copy-script">${ic.copy} Salin script</button>
      <button class="btn btn-full" style="margin-top:10px" data-act="copy-key" data-text="${esc(p.product_key)}">Salin Product ID saja</button>`);
  }
  if (act === "copy-script") return copyText(S.script);
  if (act === "copy-key") return copyText(el.dataset.text);
  if (act === "p-edit") {
    const p = S.products.find((x) => x.id === id); if (!p) return;
    return openModal(`<h2>Edit Product</h2>
      <label class="l" for="eName">Nama</label><input id="eName" class="inp" value="${esc(p.name)}" maxlength="60">
      <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px"><span>Aktif</span>
        <button class="sw ${p.is_active ? "on" : ""}" id="eActive" aria-label="Aktif" data-act="sw-local"></button></div>
      <button class="btn btn-w btn-full" style="margin-top:12px" data-act="p-save" data-id="${esc(p.id)}">Simpan</button>`);
  }
  if (act === "sw-local") return el.classList.toggle("on");
  if (act === "p-save") {
    const name = $("#eName").value.trim(); if (!name) return toast("Nama tidak boleh kosong");
    const { error } = await sb.from("products").update({ name, is_active: $("#eActive").classList.contains("on") }).eq("id", id);
    if (error) return toast("Gagal: " + error.message);
    closeModal(); toast("Tersimpan"); return go("products");
  }
  if (act === "p-del") {
    if (!confirm("Hapus produk ini? Semua whitelist-nya ikut terhapus.")) return;
    const { error } = await sb.from("products").delete().eq("id", id);
    if (error) return toast("Gagal: " + error.message);
    return go("products");
  }

  /* whitelist */
  if (act === "w-add") {
    if (!S.products.length) return toast("Buat produk dulu");
    const opts = S.products.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
    return openModal(`<h2>Add Whitelist</h2>
      <label class="l" for="wProd">Produk</label><select id="wProd" class="inp">${opts}</select>
      <label class="l" for="wType">Tipe</label><select id="wType" class="inp"><option value="GROUP">GROUP</option><option value="USER">USER</option></select>
      <label class="l" for="wId">ID Roblox</label><input id="wId" class="inp" inputmode="numeric" placeholder="GroupId / UserId">
      <label class="l" for="wNote">Catatan (opsional)</label><input id="wNote" class="inp" maxlength="80">
      <button class="btn btn-w btn-full" style="margin-top:16px" data-act="w-create">Tambah</button>`);
  }
  if (act === "w-create") {
    const raw = $("#wId").value.trim(); if (!/^\d+$/.test(raw)) return toast("ID Roblox harus angka");
    const { error } = await sb.from("whitelists").insert({ product_id: $("#wProd").value, target_type: $("#wType").value, target_id: Number(raw), note: $("#wNote").value.trim() || null });
    if (error) return toast("Gagal: " + error.message);
    closeModal(); toast("Whitelist ditambahkan"); return go("whitelist");
  }
  if (act === "w-toggle") {
    const { error } = await sb.from("whitelists").update({ is_active: el.dataset.val !== "true" }).eq("id", id);
    if (error) return toast("Gagal: " + error.message); return go("whitelist");
  }
  if (act === "w-del") {
    if (!confirm("Hapus whitelist ini?")) return;
    const { error } = await sb.from("whitelists").delete().eq("id", id);
    if (error) return toast("Gagal: " + error.message); return go("whitelist");
  }
});

/* ---------- INIT ---------- */
(async function init() {
  if (!configured) { showLogin(); $("#authErr").textContent = "Isi SUPABASE_URL dan SUPABASE_ANON_KEY di baris paling atas file."; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(); else showLogin();
})();
</script>
